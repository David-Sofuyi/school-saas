<!-- Reusable Delete Confirmation Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title d-flex align-items-center" id="confirmDeleteModalLabel">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Deletion
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="fs-6 mb-2">
                    Are you sure you want to permanently delete <strong id="confirmDeleteModalItemName">this record</strong>?
                </p>
                <p class="text-danger small mb-0">
                    <i class="bi bi-info-circle me-1"></i> This action cannot be undone. All associated records may also be affected.
                </p>
                <form id="confirmDeleteForm" method="post" action="" class="d-none">
                    {% csrf_token %}
                </form>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i> Cancel
                </button>
                <button type="button" id="confirmDeleteModalBtn" class="btn btn-danger">
                    <i class="bi bi-trash-fill me-1"></i> Delete Permanently
                </button>
            </div>
        </div>
    </div>
</div>
