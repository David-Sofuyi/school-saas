<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f7f4 0%, #e8f0fe 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .offline-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background-color: #fff3cd;
            color: #856404;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">You're Offline</h2>
        <p class="text-muted mb-4">
            It looks like your internet connection or mobile data is currently unavailable. Don't worry, your work will be saved once you are reconnected.
        </p>
        <div class="d-grid gap-2">
            <button onclick="window.location.reload()" class="btn btn-primary btn-lg shadow-sm">
                <i class="bi bi-arrow-clockwise me-1"></i> Try Reconnecting
            </button>
            <a href="/" class="btn btn-outline-secondary">
                <i class="bi bi-house-door me-1"></i> Go to Homepage
            </a>
        </div>
        <div class="mt-4 pt-3 border-top text-muted small">
            <span>Nigerian School Management SaaS</span> &bull; <span>Offline Mode</span>
        </div>
    </div>
</body>
</html>
